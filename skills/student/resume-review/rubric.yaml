          (617) 555-1234 | HLSStudent@jd28.law.harvard.edu

          EDUCATION
          Harvard Law School, Cambridge, MA
          Juris Doctor, Expected May 2028
          Honors: Dean's Scholar Prizes in Property, Legal Research & Writing
          Activities: Harvard Journal of Law & Technology, Technical Editor
                      Harvard Health Law Society, Member
                      Harvard Law Entrepreneurship Project, Member

          University of California, Los Angeles (UCLA), Los Angeles, CA
          Bachelor of Science, cum laude in Biology, May 2023
          Honors: Departmental Honors in Biology, Dean's Honor List, Outstanding Capstone Award for Thesis
          Thesis: "Autophagy and neuronal cell death: Insights into mitochondrial dysfunction"

          EXPERIENCE
          Harvard Law Entrepreneurship Project, Cambridge, MA
          Team Lead, Sept. 2025 - Present
          - Research and advise virtual health client on data privacy, FDA designation, and AI patentability, resulting in 5-page memorandum on risk assessment
          - Manage a team of four, facilitating meetings among team members, executives, and attorney advisors

          Ernst & Young, Washington, DC
          Advisory Associate, July 2023 - May 2025
          - Conducted comprehensive document review of internal agency protocols and policy documents to ensure alignment with Federal healthcare regulations
          - Analyzed operational processes of healthcare agencies to identify areas for increased efficiency and compliance
          - Developed and delivered regular briefings for senior agency leadership on complex healthcare policy initiatives
          - Led qualitative and quantitative research including stakeholder interviews to assess regulatory compliance challenges

          McKinsey & Company, Washington, D.C.
          Health Policy Summer Analyst, May 2022 - Aug. 2022
          - Translated complex public policies and legislative proposals for health industry clients
          - Researched and analyzed federal public policy and market trends for weekly client newsletters
          - Drafted presentations, issue briefs, comment letters, and client memoranda about federal legislative proposals

          SKILLS / INTERESTS
          Certifications: Certified Medical Laboratory Assistant (CMLA), 2023
          Programming: R, Python, SAS
          Interests: Freelance coding enthusiast, distance running (4x marathon), ice cream recipe development
    expected:
      - Corrected resume has minimal changes (this resume is already well-formatted)
      - May fix minor formatting inconsistencies (e.g., "D.C." vs "DC" consistency, italicize journal name, italicize *cum laude*)
      - Companion document acknowledges this is a strong, well-formatted resume
      - Companion document focuses primarily on "may refine" tier suggestions
      - Does not manufacture problems that do not exist
      - Companion document feedback is proportional to the resume's quality

