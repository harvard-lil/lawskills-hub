persona: student
skill: resume-review

criteria:
  structural:
    - id: gathers-resume-and-context
      description: Agent collects the resume and basic context before producing output
      check: Agent asks for or confirms it has the resume text, the student's year/program, and optionally their target employers before producing the corrected resume and companion document

    - id: identifies-profile
      description: Agent determines the student's profile type to apply profile-specific guidance
      check: Agent explicitly or implicitly identifies whether the student has prior work experience, is an LL.M. candidate, has military background, is a 2L/3L, or is visiting/transfer

    - id: produces-corrected-resume
      description: Agent outputs a corrected resume with mechanical fixes applied
      check: Agent delivers a formatted resume document with formatting, structural, and terminology corrections applied directly

    - id: produces-companion-document
      description: Agent outputs a separate companion suggestions document with substantive coaching
      check: Agent delivers a second document containing prioritized substantive suggestions, questions, and examples keyed to specific parts of the corrected resume

    - id: applies-mechanical-fixes-correctly
      description: Agent correctly applies OCS formatting and terminology rules
      check: Corrected resume fixes prohibited items (GPA, LSAT, personal email, basic skills), terminology ("Juris Doctor"), degree style consistency, Latin honor formatting, section ordering, and date consistency

    - id: separates-mechanical-from-substantive
      description: Agent correctly categorizes fixes -- mechanical applied directly, substantive routed to companion document
      check: Corrected resume does not contain rewritten bullet content or strategic changes; companion document does not contain formatting corrections that should have been applied directly

    - id: includes-placeholders
      description: Agent inserts bracketed placeholders where fixes require student input
      check: When the agent cannot determine a correct value (e.g., HLS email address), it inserts a visually distinct placeholder in the corrected resume

    - id: prioritizes-suggestions
      description: Agent organizes companion document suggestions by priority
      check: Companion document uses a tiered structure (must address / should consider / may refine or equivalent)

  pedagogical:
    - id: suggests-condensing-techniques-before-cutting
      description: When a resume is at or over one page, the companion document suggests OCS-endorsed condensing techniques (reduce blank-line spacing to 6-8pt, tighten language, rebalance bullet counts) before recommending that the student cut substantive experience
      weight: high

    - id: preserves-associate-degrees
      description: Agent retains any associate degree (A.A., A.S.) the student listed and does not describe it as optional; if an associate degree is present in the student's history but missing from the resume, the agent raises adding it
      weight: high

    - id: explains-the-why
      description: Companion document explains the principle or standard behind each suggestion
      weight: high

    - id: provides-concrete-examples
      description: Companion document includes example rewrites to illustrate the pattern for key suggestions
      weight: high

    - id: asks-eliciting-questions
      description: Companion document asks the student questions to draw out missing information for substantive improvements
      weight: high

    - id: acknowledges-strengths
      description: Companion document opens by noting what the student did well
      weight: medium

    - id: profile-appropriate-feedback
      description: Suggestions reflect the student's specific profile rather than generic advice
      weight: medium

    - id: mentions-ocs-review-program
      description: Companion document reminds the student about the OCS Resume Review Program
      weight: low

anti_patterns:
  - id: rewrites-content-in-corrected-resume
    description: Agent alters substantive bullet content directly in the corrected resume instead of routing to companion document
    check: Corrected resume contains rewritten bullet descriptions, altered job responsibilities, or added content that was not in the original resume (beyond formatting and terminology fixes)

  - id: invents-experience
    description: Agent fabricates experience, achievements, or credentials not present in the original resume
    check: Agent's example rewrites or corrected resume include information, roles, or accomplishments the student did not provide

  - id: ignores-ocs-standards
    description: Agent produces a corrected resume that still violates OCS rules
    check: Corrected resume retains GPA, LSAT scores, personal email, "Juris Doctorate," or other items explicitly prohibited by OCS guidance

  - id: produces-single-output-only
    description: Agent produces only feedback or only a corrected resume, not both deliverables
    check: Agent output is missing either the corrected resume or the companion suggestions document

  - id: generic-suggestions-only
    description: Companion document gives only vague advice without referencing the student's actual resume content
    check: Companion document consists entirely of general resume tips (e.g., "use action verbs," "be specific") without citing specific sections, bullets, or content from the submitted resume

  - id: silent-substantive-changes
    description: Agent makes substantive content changes in the corrected resume without explanation
    check: Content in the corrected resume differs substantively from the original without any corresponding entry in the companion document explaining the change

  - id: drops-associate-degree
    description: Agent removes the student's associate degree (A.A., A.S., or similar community-college credential) from the Education section, or tells the student it is optional to include
    check: Corrected resume omits an associate degree that appeared in the student's original resume, or the companion document advises the student that listing an A.A./A.S. is optional or unnecessary

  - id: hard-one-page-rule
    description: Agent flags a resume that is only slightly over one page as a critical error without first recommending OCS condensing techniques (reduced blank-line spacing at 6-8pt, language tightening, bullet-count rebalancing)
    check: Companion document treats a small overflow onto a second page as a must-fix-by-cutting issue without first suggesting spacing reduction and language tightening, OR the agent strips substantive experience from the corrected resume to force one page

  - id: splits-opia-experience-section
    description: On an OPIA pathway resume, the agent splits experience into separate "Legal Experience" and "Other Professional Experience" (or similarly named) sections instead of using a single unified "Experience" section
    check: Corrected resume for an OPIA pathway student uses two or more differently-titled experience sections (e.g., "Legal Experience" and "Other Professional Experience"), OR the companion document recommends creating such a split rather than consolidating

test_scenarios:
  - id: happy-path-common-errors
    setup: >
      1L student submits a resume with several common formatting and content
      errors: personal email instead of HLS email, full street address, "Juris
      Doctorate" instead of "Juris Doctor," GPA listed, vague bullets with weak
      verbs, generic interests. The resume is based on the OCS before-and-after
      sample pattern.
    messages:
      - role: user
        content: "Can you review my resume? I'm a 1L targeting BigLaw for my 1L summer."
      - role: user
        content: |
          JANE DOE
          1585 Massachusetts Avenue, #123, Cambridge, MA 02138
          (617) 555-5555 | janedoe@gmail.com

          EDUCATION
          Harvard Law School, Cambridge, MA
          Candidate for Juris Doctorate, Expected May 2028
          Activities: Harvard Law Entrepreneurship Project, Harvard Journal of Law and Technology (subcite editor), Harvard Animal Law Society, Women's Law Association

          Boston University, Boston, MA
          B.A. in Political Science, Summa Cum Laude, May 2024
          Honors: 3.97 GPA, Dean's List (all semesters), Phi Beta Kappa
          Thesis: Trade Policy and Tariffs: How U.S. Regulatory Changes are Influencing Supply Chain Regionalization

          EXPERIENCE
          Blueprint Test Preparation, Boston, MA
          LSAT Tutor, May 2024 - August 2025
          - Answered student inquiries promptly with detailed feedback.
          - Tutored students individually and in small groups, discussed test structure and timing.
          - Reviewed reading comprehension and analytical reasoning sections.
          - Supported students in test-taking strategies.

          Mason, Clark & Rivera LLP, Seattle, WA
          Legal Assistant Intern, Civil Rights Division, May-August 2023
          - Assisted attorneys with case preparation through gathering and reviewing documents.
          - Helped organize information related to potential clients and company records.
          - Communicated with individuals involved in the case under attorney supervision.

          SKILLS AND INTERESTS
          Languages: English (Native), French (Proficient)
          Skills: Microsoft Office, Google Suite, WestLaw, Lexis
          Interests: Travel, Cooking, Reading, and Running
    expected:
      - "Corrected Resume: Replaces personal email (gmail) with placeholder for HLS email"
      - "Corrected Resume: Replaces full street address with 'Cambridge, MA'"
      - "Corrected Resume: Changes 'Juris Doctorate' to 'Juris Doctor'"
      - "Corrected Resume: Changes 'Candidate for...Expected' to use one or the other"
      - "Corrected Resume: Removes 3.97 GPA from honors"
      - "Corrected Resume: Changes 'Summa Cum Laude' to italicized lowercase '*summa cum laude*'"
      - "Corrected Resume: Ensures Phi Beta Kappa is not italicized"
      - "Corrected Resume: Aligns degree style (B.A. with J.D., or Bachelor of Arts with Juris Doctor)"
      - "Corrected Resume: Italicizes '*Harvard Journal of Law and Technology*'"
      - "Corrected Resume: Places activities on separate lines"
      - "Corrected Resume: Removes English from languages"
      - "Corrected Resume: Removes Microsoft Office, Google Suite, Lexis, Westlaw from skills"
      - "Corrected Resume: Normalizes date formatting throughout"
      - "Corrected Resume: Preserves original bullet content without rewriting"
      - "Companion Document: Flags vague bullets ('Answered,' 'Assisted,' 'Helped,' 'Supported') with examples of stronger alternatives"
      - "Companion Document: Notes generic interests need specificity"
      - "Companion Document: Asks questions to elicit missing metrics and details"
      - "Companion Document: Mentions OCS Resume Review Program"
      - "Does NOT rewrite bullet content in the corrected resume"

  - id: boundary-test-rewrite-request
    setup: >
      Student explicitly asks the agent to just rewrite everything.
      Agent should produce both outputs but explain the two-output approach.
    messages:
      - role: user
        content: "Here's my resume. Can you just rewrite it for me so it's perfect? I don't want feedback, I want a finished product."
      - role: user
        content: |
          SAM STUDENT
          Cambridge, MA | sstudent@jd28.law.harvard.edu | (617) 555-1234

          EDUCATION
          Harvard Law School, Cambridge, MA
          J.D. Candidate, May 2028

          University of Michigan, Ann Arbor, MI
          B.A. in History with High Distinction, May 2024
          Honors: Phi Beta Kappa

          EXPERIENCE
          Local Restaurant, Ann Arbor, MI
          Server, June 2020 - May 2024
          - Waited tables and took orders.
          - Handled cash register.
          - Trained new staff.
    expected:
      - Explains the two-output approach -- mechanical fixes applied directly, substantive changes in companion document
      - Frames the approach positively (the student keeps ownership of content decisions)
      - Produces a corrected resume with formatting fixes applied
      - Produces a companion suggestions document
      - Companion document points out thin Experience bullets and suggests how to strengthen them
      - Companion document notes that restaurant experience has real transferable skills worth surfacing (customer service, cash handling, training, multitasking)
      - Does NOT rewrite bullet content in the corrected resume

  - id: strong-resume-refinement
    setup: >
      2L student with prior consulting work experience submits a resume that
      is already well-formatted and substantive. Corrected resume should have
      minimal changes; companion document focuses on strategic refinements.
    messages:
      - role: user
        content: "I'm a 2L who worked at Ernst & Young before law school. Can you review my resume? I'm targeting corporate/transactional firms."
      - role: user
        content: |
          HARVARD STUDENT
