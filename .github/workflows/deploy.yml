# Deploy the Legal Ed Skills Hub to GitHub Pages.
# The build itself lives in harvard-lil/skills-hub.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    uses: harvard-lil/skills-hub/.github/workflows/build-and-deploy.yml@main
    with:
      custom-gpt-url: ${{ vars.CUSTOM_GPT_URL }}
